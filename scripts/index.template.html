<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- Primary favicon -->
    <link
      rel="icon"
      type="image/png"
      href="%PUBLIC_URL%/favicon.png"
    />
    <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.png" />

    <!-- Installed app (home screen) -->
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="{{SHORT_NAME}}" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <link
      rel="preconnect"
      href="{{API_ORIGIN}}"
      crossorigin
    />
    <link rel="preconnect" href="https://iframe.mediadelivery.net" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="{{THEME_COLOR}}" />

    <!-- Generated from client-profile/profile.json by scripts/apply-profile.js -->
    <meta
      name="description"
      content="{{DESCRIPTION}}"
    />

    <!-- Link previews (Facebook, WhatsApp, LinkedIn, X). These services read this file only. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="{{SITE_NAME}}" />
    <meta property="og:title" content="{{SITE_NAME}}" />
    <meta
      property="og:description"
      content="{{DESCRIPTION}}"
    />
    <meta
      property="og:url"
      content="{{SITE_URL}}/"
    />
    <meta
      property="og:image"
      content="{{SITE_URL}}/share-image.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{SITE_NAME}}" />
    <meta
      name="twitter:description"
      content="{{DESCRIPTION}}"
    />
    <meta
      name="twitter:image"
      content="{{SITE_URL}}/share-image.png"
    />

    <!-- PWA manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <title>{{SITE_NAME}}</title>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div
        style="
          min-height: 100vh;
          display: grid;
          place-items: center;
          background: #000;
          color: #bbb;
          font-family: sans-serif;
        "
      >
        Loading…
      </div>
    </div>
  </body>
</html>
