<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#030104" />
    <title>BishopRobertson.TV — offline</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center; padding: 24px; box-sizing: border-box;
        background: #030104; color: #e5e7eb;
        font: 16px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      img { width: 96px; height: 96px; border-radius: 50%; }
      h1 { font-size: 22px; margin: 18px 0 6px; }
      p { margin: 0 auto 20px; max-width: 32ch; color: #cbd5e1; }
      button {
        font: inherit; font-weight: 700; color: #fff; background: #7c3aed;
        border: 0; border-radius: 999px; padding: 12px 22px; cursor: pointer;
      }
      button:focus-visible { outline: 3px solid #a78bfa; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="pwa-icon-192.png" alt="" />
      <h1>You’re offline</h1>
      <p>Videos need an internet connection. Connect to Wi‑Fi or mobile data and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
